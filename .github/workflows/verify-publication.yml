name: Verify publication integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify declared files, hashes, and XML syntax
        run: python3 scripts/verify_publication.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
