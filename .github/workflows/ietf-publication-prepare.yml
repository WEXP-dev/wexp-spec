name: IETF publication PREPARE

# Phase A only. This workflow builds a publication bundle and decides whether a
# revision is fit to submit. It NEVER submits: it does not set the live switch,
# it has no access to any submission secret, and it asserts in-job that no
# network submission was performed.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'Exact artifact identity, e.g. draft-sergeev-wexp-core-01'
        required: true
        type: string
      ref:
        description: 'Publication tag ref to evaluate, e.g. refs/tags/draft-sergeev-wexp-core-01'
        required: true
        type: string
  push:
    tags:
      - 'draft-*-[0-9][0-9]'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare publication bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags are required to verify that the tag commit is
          # contained in authorized public spec state and that the tag is signed.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve publication identity
        id: identity
        env:
          INPUT_IDENTITY: ${{ inputs.identity }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IDENTITY}" ]; then
            identity="${INPUT_IDENTITY}"
            ref="${INPUT_REF}"
          else
            identity="${GITHUB_REF_NAME}"
            ref="${GITHUB_REF}"
          fi
          case "${ref}" in
            refs/tags/*) ;;
            *) echo "NOT READY — publication PREPARE requires a tag ref, got ${ref}" >&2; exit 1 ;;
          esac
          printf 'identity=%s\n' "${identity}" >>"$GITHUB_OUTPUT"
          printf 'ref=%s\n' "${ref}" >>"$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pinned draft toolchain
        run: |
          python -m pip install --disable-pip-version-check --no-input "xml2rfc==3.34.0"
          npm install --global --no-fund --no-audit "idnits@3.1.0"

      - name: Prepare publication bundle
        id: prepare
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          REF: ${{ steps.identity.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/prepare_publication.py \
            --identity "${IDENTITY}" \
            --ref "${REF}" \
            --bundle-root "build/publication/${IDENTITY}" \
            > "build/prepare.log" 2>&1 && status=0 || status=$?
          cat build/prepare.log
          printf 'status=%s\n' "${status}" >>"$GITHUB_OUTPUT"
          grep -qx 'SUBMISSION NOT PERFORMED' build/prepare.log

      - name: Assert no submission was performed
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path("build/publication") / os.environ["IDENTITY"]
          dry_run = json.loads((root / "evidence" / "dry-run.json").read_text())
          manifest = json.loads((root / "BUNDLE-MANIFEST.json").read_text())
          if dry_run["result"] != "SUBMISSION NOT PERFORMED":
              sys.exit(f"unexpected dry-run result: {dry_run['result']}")
          if dry_run["network_submission_performed"] or manifest["submission_performed"]:
              sys.exit("a submission was recorded; PREPARE must never submit")
          print(manifest["terminal_result"])
          print("SUBMISSION NOT PERFORMED")
          PY

      - name: Upload publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-bundle-${{ steps.identity.outputs.identity }}
          path: build/publication/${{ steps.identity.outputs.identity }}/
          if-no-files-found: error
          retention-days: 90

      - name: Report terminal result
        env:
          STATUS: ${{ steps.prepare.outputs.status }}
        run: |
          set -euo pipefail
          # A NOT READY verdict is a legitimate, informative outcome of PREPARE,
          # but it must be visible as a failed job so nobody mistakes it for READY.
          exit "${STATUS}"
